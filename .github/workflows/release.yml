name: Release

# Run it by hand from the Actions tab, or by pushing a tag like v1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15

    # Attaching the zip to a Release means writing to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Signing needs the certificate and its private key in a keychain. A
      # throwaway one keeps them out of the runner's default keychain and lets
      # the whole lot be deleted afterwards.
      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a UI prompt that nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it first in the search list so xcodebuild finds the certificate.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build, notarise and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./Scripts/release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: FrankerFaceZ
          path: build/release/FrankerFaceZ.zip
          if-no-files-found: error

      # A run started by hand leaves only the artifact, which expires. A tagged
      # run also publishes a Release, so the zip stays downloadable from the
      # repository's front page.
      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="build/release/FrankerFaceZ-$GITHUB_REF_NAME.zip"
          mv build/release/FrankerFaceZ.zip "$ASSET"
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
